# Streamlit settings for the local dashboard (frgrid dashboard).

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
# Local only: listen on this machine, do not expose the dashboard on the network.
address = "localhost"
headless = true
runOnSave = false

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
